name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APK_NAME: som
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Read app version
        id: version
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/^app\.versionName=//p' gradle.properties | tail -n 1)"
          if [[ -z "$APP_VERSION" ]]; then
            echo "Unable to read the app version."
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          : "${KEYSTORE_BASE64:?Add KEYSTORE_BASE64 to the repository Actions secrets}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${SIGNING_STORE_PASSWORD:?Add KEYSTORE_PASSWORD to the repository Actions secrets}"
          : "${SIGNING_KEY_ALIAS:?Add KEY_ALIAS to the repository Actions secrets}"
          : "${SIGNING_KEY_PASSWORD:?Add KEY_PASSWORD to the repository Actions secrets}"
          ./gradlew :app:assembleRelease -PciBuildNumber="$BUILD_NUMBER"

      - name: Prepare APK artifact
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
            "release/${APK_NAME}-v${APP_VERSION}-build.${BUILD_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.app_version }}-build.${{ github.run_number }}
          name: SOM v${{ needs.build.outputs.app_version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: release/*.apk
          body: |
            Automated Android release from the `main` branch.

            **Build details**
            - Version: ${{ needs.build.outputs.app_version }}
            - Build number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Triggered by: ${{ github.actor }}
